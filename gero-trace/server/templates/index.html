<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header>
  <h1>{{ app_name }}</h1>
  <nav id="nav" hidden>
    <span id="stats"></span>
    <button id="logout" class="link">Sign out</button>
  </nav>
</header>

<main id="login" hidden>
  <form id="loginForm" class="card narrow">
    <h2>Sign in</h2>
    <p class="muted">Engineering only. Salesforce users ask questions from the Ask Claude component.</p>
    <label>Admin password <input type="password" id="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
</main>

<main id="app" hidden>
  <section id="list" class="card">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search questions, answers, record ids…">
      <select id="filterStatus">
        <option value="">All statuses</option>
        <option value="queued">Queued</option><option value="running">Running</option>
        <option value="answered">Answered</option><option value="reported">Reported</option><option value="failed">Failed</option>
      </select>
      <select id="filterFix">
        <option value="">Any fix state</option>
        <option value="awaiting_approval">Awaiting approval</option><option value="approved">Approved</option>
        <option value="running">Fix running</option><option value="pr_open">PR open</option>
        <option value="merged">Merged</option><option value="failed">Fix failed</option><option value="declined">Declined</option>
      </select>
      <button id="refresh">Refresh</button>
    </div>
    <table>
      <thead><tr><th>When</th><th>Who</th><th>Question</th><th>Status</th><th>Confidence</th><th>Issue</th><th>Fix</th><th>Cost</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section id="detail" class="card" hidden>
    <button id="back" class="link">← All investigations</button>
    <div id="detailBody"></div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
