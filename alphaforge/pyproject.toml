[project]
name = "alphaforge"
version = "0.1.0"
description = "AI-powered, fully automated day-trading platform with self-training model lifecycle"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "hmmlearn>=0.3",
  "optuna>=3.6",
  "pyarrow>=15",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "websockets>=12",
  "apscheduler>=3.10",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "anthropic>=0.40",
  "yfinance>=0.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
alphaforge = "alphaforge.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alphaforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
